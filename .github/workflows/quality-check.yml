name: Quality check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Corrigir dependências vulneráveis compatíveis
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: npm audit fix || true

      - name: Registrar correções de dependências
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "Nenhuma alteração de dependência necessária."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: atualiza dependências vulneráveis compatíveis"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Smoke test das rotas locais
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/incluatech-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID' EXIT

          for tentativa in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          for rota in / /projeto /participar /vagas /blog /auth /privacidade /termos /pagina-inexistente; do
            echo "Testando $rota"
            curl --silent --fail "http://127.0.0.1:4173$rota" | grep --quiet '<div id="root"></div>'
          done

      - name: Diagnóstico da configuração Supabase
        continue-on-error: true
        shell: bash
        run: |
          set -a
          source .env
          set +a

          REPO_HOST=${VITE_SUPABASE_URL#https://}
          REPO_HOST=${REPO_HOST%/}
          echo "Host configurado no repositório: $REPO_HOST"
          getent hosts "$REPO_HOST" || echo "DNS do host do repositório não respondeu"

          PREVIEW_URL="https://deploy-preview-1--incluatech.netlify.app"
          curl --silent --fail "$PREVIEW_URL" --output /tmp/preview.html
          ASSET_PATH=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/preview.html | head -n 1)
          test -n "$ASSET_PATH"
          curl --silent --fail "$PREVIEW_URL$ASSET_PATH" --output /tmp/preview.js

          DEPLOYED_URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' /tmp/preview.js | head -n 1)
          test -n "$DEPLOYED_URL"
          echo "URL Supabase detectada na prévia: $DEPLOYED_URL"

      - name: Smoke test público do Supabase
        continue-on-error: true
        shell: bash
        run: |
          set -a
          source .env
          set +a

          AUTH_STATUS=$(curl --silent --output /tmp/auth-settings.json --write-out '%{http_code}' \
            "$VITE_SUPABASE_URL/auth/v1/settings" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" || true)
          echo "Auth status: ${AUTH_STATUS:-falha de conexão}"

          JOBS_STATUS=$(curl --silent --output /tmp/jobs.json --write-out '%{http_code}' \
            "$VITE_SUPABASE_URL/rest/v1/jobs?select=id,title,is_active&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" || true)
          echo "Jobs status: ${JOBS_STATUS:-falha de conexão}"

          BLOG_STATUS=$(curl --silent --output /tmp/blog.json --write-out '%{http_code}' \
            "$VITE_SUPABASE_URL/rest/v1/blog_posts?select=id,title,is_published&is_published=eq.true&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" || true)
          echo "Blog status: ${BLOG_STATUS:-falha de conexão}"

          test "$AUTH_STATUS" = "200"
          test "$JOBS_STATUS" = "200"
          test "$BLOG_STATUS" = "200"

      - name: Auditoria de dependências de produção
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
