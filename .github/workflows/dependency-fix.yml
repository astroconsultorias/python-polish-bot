name: Dependency security fix

on:
  push:
    branches: [redesign/incluatech-template]
    paths:
      - .github/workflows/dependency-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: redesign/incluatech-template

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar correções compatíveis
        run: npm audit fix

      - name: Validar lint
        run: npm run lint

      - name: Validar build
        run: npm run build

      - name: Validar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Registrar atualizações
        shell: bash
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "Nenhuma atualização de dependência necessária."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: atualiza dependências vulneráveis"
          git push origin HEAD:redesign/incluatech-template
